[project]
name = "vista-memory"
version = "0.1.0"
description = "VISTA image records with optional GLSL and MCP retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=13.0,<14"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<2.4"]

[project.scripts]
vista-memory-mcp = "vista_memory.mcp:main"

[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17.5,<0.18"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
